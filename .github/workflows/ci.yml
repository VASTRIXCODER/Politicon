name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # The build points at the in-memory fake Supabase that Playwright starts
      # on this port (tests/e2e/fake-supabase.mjs), so the signed-in journey
      # runs hermetically; no real services are contacted. The key is a placeholder.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3201
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (zero warnings)
        run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Eval heuristics and guardrail checks (no API key, so no model calls)
        run: npm run eval
      - run: npm run build
      - name: Bundle budget (first-load JS per page)
        run: npm run check:bundle
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop 1280x800 and mobile 375x812, against the production build)
        # playwright.config.ts starts the fake Supabase (port 3201) and `next start -p 3200`
        # on the build above; the hermetic signed-in journey fails here if the build doesn't target the fake.
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Separate job so a newly published advisory doesn't hide lint, test and
  # build results. Reads only package-lock.json; nothing is installed. Fails on
  # high/critical advisories except those accepted, with a reason, in the script.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies (high and critical)
        run: npm run audit:prod

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Build schema from migrations and run security assertions
        run: ./supabase/tests/run.sh
